# The docs portal (Zensical). Build: uv run task docs   Live: uv run task docs_live
# Pages live in docs/content, shared with the Sphinx manual (docs/sphinx). Keep `nav` in step
# with the toctrees in content/manual.md; tests/unit/test_docs.py checks both. The handbook's
# entries are generated by `uv run task sync`.

[project]
# Between the sync: markers, generated from brand.toml by `uv run task sync`.
# sync:identity
site_name = "Sgaffald"
site_description = "Cyber Scallywags base template: FastAPI, FastUI, Streamlit, Ionic and Neo4j"
site_author = "Cyber Scallywags"
copyright = "© 2026 Cyber Scallywags · Play • Learn • Share • Grow"
# /sync:identity
docs_dir = "content"
site_dir = "_build/site"
# Sphinx-only pages; the manual is built into _build/site/manual after the portal.
# sync:exclude
exclude_docs = """
manual.md
reference/python-api-sphinx.md
"""
# /sync:exclude
extra_css = [
  "assets/stylesheets/brand.css",
  "assets/stylesheets/template.css",
  "assets/stylesheets/zensical.css",
  "assets/stylesheets/brand-extra.css",
]

nav = [
  { "Home" = "index.md" },
  { "Project" = [
    "project/overview.md",
  ] },
  # The Handbook tab is generated from HANDBOOK in scripts/sync_meta.py.
  # sync:handbook
  { "Handbook" = [
    "handbook/index.md",
    "handbook/getting-started.md",
    "handbook/architecture.md",
    "handbook/site-manifest.md",
    "handbook/brand-kit.md",
    "handbook/sign-on.md",
    "handbook/make-it-yours.md",
    "handbook/upgrade.md",
    "handbook/from-scratch.md",
    { "Services" = [
      "handbook/services/api.md",
      "handbook/services/web-ui.md",
      "handbook/services/admin.md",
      "handbook/services/mobile.md",
      "handbook/services/docs.md",
    ] },
    { "Development" = [
      "handbook/development/ways-of-working.md",
      "handbook/development/testing.md",
      "handbook/development/environments.md",
      "handbook/development/ci-cd.md",
    ] },
    { "Decisions" = [
      "handbook/decisions/index.md",
      "handbook/decisions/0001-structure-and-reuse.md",
      "handbook/decisions/0002-storage-and-reuse.md",
      "handbook/decisions/0003-brand-kit-and-sign-on.md",
    ] },
  ] },
  # /sync:handbook
  { "Reference" = [
    "reference/http-api.md",
    "reference/models.md",
    "reference/configuration.md",
    "reference/tasks.md",
    "reference/site-sample.md",
    "reference/project-metadata.md",
    "reference/python-api.md",
    { "Manual (Sphinx)" = "/manual/" },
  ] },
  { "About" = "about.md" },
]

[project.theme]
language = "en"
# sync:images
logo = "assets/brand/mark.png"
favicon = "assets/brand/favicon.png"
# /sync:images
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.font]
text = false
code = false

# The brand's first scheme ([theme.docs] scheme in brand.toml); readers can switch.
# sync:palette
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"
# /sync:palette

# sync:social
[[project.extra.social]]
icon = "lucide/globe"
link = "https://cyberscallywags.com"
name = "Cyber Scallywags"
# /sync:social

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["../src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true
show_source = false
heading_level = 2
