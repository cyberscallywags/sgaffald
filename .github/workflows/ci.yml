# Every branch push and every PR into main is linted, unit tested, built and
# integration + browser tested (desktop UI, admin, docs and the mobile app on an emulated phone)
# against the full stack. Make "CI / ci-passed" a required
# check on main (see README) so nothing merges without it.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reused by release.yml on merge to main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:   # feature/, bug/, task/, docs/ or refactor/ (scripts/check_branch_name.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_branch_name.sh "$BRANCH"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run task hooks
        env:
          SKIP: no-commit-to-branch   # CI also runs on main, via release.yml

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run task test --cov-report=xml
      - name: Upload coverage (Codecov badge)
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mobile:   # Ionic app lint + unit tests, inside its Docker build stage (no Node setup needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run task test_mobile

  docs:   # generate the reference, build the Zensical portal and Sphinx manual (both strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run task docs

  smoke:   # a project built from the template with another brand passes lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked
      - run: uv run task smoke

  integration:
    needs: [branch-name, quality, unit, mobile, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --locked --all-groups   # adds the e2e (Playwright) and load (Locust) groups
      - name: Build images and start stack
        run: uv run task up
      - name: Integration tests
        run: uv run task test_int
      - name: Browser tests (Playwright)
        run: uv run playwright install --with-deps chromium && uv run task test_e2e
      - name: Load smoke (Locust)
        run: uv run task load
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env.project --env-file .env.test logs --no-color
      - if: always()
        run: uv run task down

  ci-passed:   # single required status check for branch protection
    needs: [branch-name, quality, unit, mobile, docs, smoke, integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI stages passed"
